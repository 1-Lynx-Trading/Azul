<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Azul — Share Your Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --text: #e8e4dc;
    --text2: #888;
    --accent: #c9a96e;
    --accent2: #e8c88a;
    --danger: #c96e6e;
    --success: #6ec98a;
    --radius: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ── NAV ── */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(14,14,14,0.97);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: var(--accent);
    cursor: pointer;
    letter-spacing: 0.02em;
    user-select: none;
    flex-shrink: 0;
  }
  .nav-logo span { font-style: italic; }

  .nav-center { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .nav-search {
    display: flex;
    align-items: center;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    gap: 8px;
    flex: 1;
    max-width: 280px;
    transition: border-color .2s;
  }
  .nav-search:focus-within { border-color: var(--accent); }
  .nav-search svg { color: var(--text2); flex-shrink: 0; }
  .nav-search input {
    background: none;
    border: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    width: 100%;
    outline: none;
    padding: 0;
  }
  #nav-auth { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
  .nav-user {
    font-size: 0.8rem;
    color: var(--text2);
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── TABS ── */
  .feed-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.875rem;
    padding: 10px 18px;
    cursor: pointer;
    transition: all .18s;
    margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ── GENRE FILTER ── */
  .genre-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .genre-chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
    font-size: 0.78rem;
    padding: 5px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all .18s;
  }
  .genre-chip:hover { color: var(--text); border-color: #444; }
  .genre-chip.active { background: rgba(201,169,110,0.15); border-color: var(--accent); color: var(--accent); }

  /* ── BUTTONS ── */
  button { cursor: pointer; font-family: 'DM Sans', sans-serif; border: none; outline: none; transition: all .18s; }

  .btn-primary {
    background: var(--accent);
    color: #0e0e0e;
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 500;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent2); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-primary.large { padding: 12px 32px; font-size: 1rem; border-radius: 8px; }
  .btn-primary.full { width: 100%; padding: 13px; font-size: 0.95rem; border-radius: 8px; margin-top: 2px; }

  .btn-ghost {
    background: transparent;
    color: var(--text2);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 0.85rem;
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text); border-color: #444; }

  .btn-delete {
    background: transparent;
    color: var(--danger);
    font-size: 0.75rem;
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid transparent;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .btn-delete:hover { border-color: var(--danger); }

  .back-btn {
    background: none;
    color: var(--text2);
    font-size: 0.85rem;
    padding: 0;
    margin-bottom: 28px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .back-btn:hover { color: var(--accent); }

  /* ── LAYOUT ── */
  #main {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  .loading, .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text2);
  }
  .empty-icon { font-size: 2rem; color: var(--accent); margin-bottom: 16px; }
  .empty-state p { margin-bottom: 24px; }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── FEED ── */
  .feed { display: flex; flex-direction: column; gap: 20px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    cursor: pointer;
    transition: border-color .2s, transform .18s, box-shadow .2s;
    position: relative;
    overflow: hidden;
  }
  .card:hover { border-color: #3a3630; transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }

  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .card-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .author-tag {
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--accent);
    background: rgba(201,169,110,0.1);
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.04em;
  }
  .author-tag.anon { color: var(--text2); background: rgba(255,255,255,0.05); }
  .time-tag { font-size: 0.72rem; color: var(--text2); }

  .genre-tag {
    font-size: 0.7rem;
    color: var(--text2);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 12px;
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 10px;
  }
  .card-preview { font-size: 0.88rem; color: var(--text2); line-height: 1.65; margin-bottom: 16px; }
  .card-footer { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .react-btn {
    background: transparent;
    color: var(--text2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.82rem;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .18s;
  }
  .react-btn:hover { color: var(--accent); border-color: var(--accent); }
  .react-btn.liked { color: #e86e6e; border-color: #e86e6e; }
  .react-btn.saved { color: var(--accent); border-color: var(--accent); }
  .react-btn.big { padding: 8px 20px; font-size: 0.9rem; }

  /* ── STORY VIEW ── */
  .story-view { animation: fadeUp .3s ease; }
  @keyframes fadeUp { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: none; } }

  .story-full {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px;
    margin-bottom: 32px;
  }
  .story-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  .story-title {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 28px;
  }
  .story-body { font-size: 1rem; line-height: 1.85; color: #c8c4bc; }
  .story-body p { margin-bottom: 1.2em; }
  .story-body h2 { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin: 1.5em 0 0.5em; color: var(--text); }
  .story-body h3 { font-family: 'Playfair Display', serif; font-size: 1.15rem; margin: 1.2em 0 0.4em; color: var(--text); }
  .story-body blockquote { border-left: 3px solid var(--accent); padding-left: 16px; color: var(--text2); font-style: italic; margin: 1.2em 0; }
  .story-body strong { color: var(--text); font-weight: 500; }
  .story-body em { font-style: italic; }
  .story-actions { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

  /* ── SERIES BADGE ── */
  .series-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--accent);
    background: rgba(201,169,110,0.1);
    border: 1px solid rgba(201,169,110,0.25);
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 16px;
  }

  /* ── COMMENTS ── */
  .comments-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    margin-bottom: 24px;
  }
  .comments-heading {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    margin-bottom: 20px;
    color: var(--accent);
  }
  #comments-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 28px; }
  .comment {
    padding: 14px 16px;
    background: var(--surface2);
    border-radius: 8px;
    border-left: 2px solid var(--border);
  }
  .comment-author { font-size: 0.8rem; font-weight: 500; color: var(--accent); margin-right: 8px; }
  .comment-time { font-size: 0.72rem; color: var(--text2); }
  .comment p { margin-top: 6px; font-size: 0.9rem; color: #bbb; }
  .no-comments { color: var(--text2); font-size: 0.88rem; font-style: italic; }
  .comment-form { display: flex; flex-direction: column; gap: 12px; }
  .comment-controls { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

  /* ── WRITE VIEW ── */
  .write-view { animation: fadeUp .3s ease; }
  .write-heading {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    margin-bottom: 28px;
  }
  .write-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
  .write-options { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

  /* ── RICH TEXT TOOLBAR ── */
  .editor-toolbar {
    display: flex;
    gap: 4px;
    padding: 8px 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    flex-wrap: wrap;
  }
  .tool-btn {
    background: none;
    border: 1px solid transparent;
    color: var(--text2);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 0.82rem;
    font-weight: 500;
    min-width: 28px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .tool-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); border-color: var(--border); }
  .tool-btn.active { background: rgba(201,169,110,0.15); color: var(--accent); border-color: rgba(201,169,110,0.3); }
  .tool-sep { width: 1px; background: var(--border); margin: 0 4px; align-self: stretch; }

  .story-body-editor {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    border-radius: 0 0 8px 8px;
    padding: 16px;
    width: 100%;
    outline: none;
    line-height: 1.8;
    min-height: 280px;
    transition: border-color .2s;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .story-body-editor:focus { border-color: var(--accent); }
  .story-body-editor:empty:before { content: attr(data-placeholder); color: #555; pointer-events: none; }
  .story-body-editor blockquote { border-left: 3px solid var(--accent); padding-left: 14px; color: var(--text2); font-style: italic; margin: 8px 0; }
  .story-body-editor h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--text); }
  .story-body-editor h3 { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--text); }
  .story-body-editor img { max-width: 100%; border-radius: 8px; margin: 8px 0; display: block; }

  /* ── INPUTS ── */
  input[type=text], input[type=email], input[type=password], input[type=url], textarea, select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    border-radius: 8px;
    padding: 12px 16px;
    width: 100%;
    outline: none;
    transition: border-color .2s;
    resize: vertical;
    -webkit-appearance: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  ::placeholder { color: #555; }
  select { cursor: pointer; }
  select option { background: var(--surface2); }

  .story-title-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    border-radius: 8px;
    padding: 12px 16px;
    width: 100%;
    outline: none;
    margin-bottom: 14px;
    transition: border-color .2s;
  }
  .story-title-input:focus { border-color: var(--accent); }

  .form-row { display: flex; gap: 12px; margin-bottom: 14px; }
  .form-row > * { flex: 1; }
  .form-label { font-size: 0.78rem; color: var(--text2); margin-bottom: 6px; display: block; }

  .anon-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    color: var(--text2);
    cursor: pointer;
    user-select: none;
  }
  .anon-label input[type=checkbox] { width: auto; cursor: pointer; accent-color: var(--accent); }

  /* ── READING LIST VIEW ── */
  .reading-list-view { animation: fadeUp .3s ease; }
  .reading-list-heading {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    margin-bottom: 28px;
  }

  /* ── PROFILE VIEW ── */
  .profile-view { animation: fadeUp .3s ease; }
  .profile-header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    margin-bottom: 28px;
    text-align: center;
  }
  .profile-avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: rgba(201,169,110,0.15);
    border: 2px solid rgba(201,169,110,0.3);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: var(--accent);
    margin: 0 auto 16px;
  }
  .profile-name { font-family: 'Playfair Display', serif; font-size: 1.5rem; margin-bottom: 8px; }
  .profile-stats { display: flex; gap: 24px; justify-content: center; margin-top: 16px; }
  .profile-stat { text-align: center; }
  .profile-stat-num { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
  .profile-stat-label { font-size: 0.75rem; color: var(--text2); }

  /* ── ANALYTICS ── */
  .analytics-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 24px;
  }
  .analytics-heading {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    margin-bottom: 20px;
    color: var(--accent);
  }
  .analytics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .analytics-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
  }
  .analytics-num { font-size: 1.8rem; font-weight: 700; color: var(--accent); font-family: 'Playfair Display', serif; }
  .analytics-label { font-size: 0.75rem; color: var(--text2); margin-top: 4px; }

  /* ── FOLLOWING / AUTHOR PAGE ── */
  .follow-btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    padding: 6px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: all .18s;
  }
  .follow-btn:hover, .follow-btn.following { background: rgba(201,169,110,0.15); }
  .follow-btn.following { color: var(--accent2); border-color: var(--accent2); }

  /* ── SEARCH RESULTS ── */
  .search-view { animation: fadeUp .3s ease; }
  .search-heading {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    margin-bottom: 24px;
    color: var(--text2);
  }
  .search-heading span { color: var(--text); }

  /* ── MODAL ── */
  #modal-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(6px);
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #modal-overlay.visible { display: flex; }

  #modal-box {
    background: var(--surface);
    border: 1px solid #333;
    border-radius: 16px;
    padding: 36px 32px;
    width: 100%;
    max-width: 400px;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: fadeUp .25s ease;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    margin-bottom: 6px;
    color: var(--text);
  }
  .modal-close {
    position: absolute; top: 16px; right: 16px;
    background: none; color: var(--text2); font-size: 1rem;
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    padding: 0; line-height: 1;
  }
  .modal-close:hover { color: var(--text); border-color: #555; }
  .modal-switch { font-size: 0.82rem; color: var(--text2); text-align: center; margin-top: 4px; }
  .modal-switch a { color: var(--accent); cursor: pointer; text-decoration: underline; }

  .error-msg {
    background: rgba(201,110,110,0.15);
    border: 1px solid rgba(201,110,110,0.4);
    color: #e89090;
    padding: 10px 14px;
    border-radius: 7px;
    font-size: 0.82rem;
    display: none;
  }
  .error-msg.show { display: block; }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1e1e1e;
    border: 1px solid #333;
    color: var(--text);
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 0.85rem;
    opacity: 0;
    transition: all .3s;
    pointer-events: none;
    z-index: 400;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  /* ── PROMPTS BANNER ── */
  .prompt-banner {
    background: linear-gradient(135deg, rgba(201,169,110,0.08), rgba(201,169,110,0.03));
    border: 1px solid rgba(201,169,110,0.2);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .prompt-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 4px; }
  .prompt-text { font-family: 'Playfair Display', serif; font-size: 1rem; font-style: italic; color: var(--text); }

  /* ── SERIES SELECT ── */
  .series-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 24px;
  }

  /* ── SVG ICONS ── */
  .icon { width: 14px; height: 14px; display: inline-block; vertical-align: middle; }
  .icon-sm { width: 12px; height: 12px; }
  .icon-lg { width: 16px; height: 16px; }

  @media (max-width: 600px) {
    nav { padding: 0 12px; gap: 8px; }
    .nav-search { max-width: 140px; }
    #main { padding: 24px 14px 60px; }

    #modal-box { padding: 28px 20px; }
    .form-row { flex-direction: column; }
    .analytics-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>

    <button class="btn-primary" onclick="App.goWrite()">
      <svg class="icon" style="margin-right:4px"><use href="#ic-pen"/></svg>Write
    </button>

<div id="main"><div class="loading"><span class="spin">◌</span> Loading…</div></div>

  <div id="modal-box"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyB1kOebyVKpGVCUoG6e5WBurOK-cqMTDDA",
  authDomain: "azul-azul-azul.firebaseapp.com",
  projectId: "azul-azul-azul",
  storageBucket: "azul-azul-azul.firebasestorage.app",
  messagingSenderId: "544736797044",
  appId: "1:544736797044:web:7863b3c74e71e10daacc21",
  measurementId: "G-LGJDK6MPQL"
});
const auth = firebase.auth();
const db   = firebase.firestore();

const GENRES = ['Fiction','Non-Fiction','Poetry','Horror','Romance','Sci-Fi','Fantasy','Mystery','Personal','Humour','Travel','Other'];
const PROMPTS = [
  'Write about a door you were afraid to open.',
  'The last message you never sent.',
  'Describe the silence after something breaks.',
  'A stranger who changed everything in five minutes.',
  'The version of yourself you left behind.',
  'Write from the perspective of your oldest object.',
  'Begin with the words: "It was the wrong address."',
  'Something you only admit at 3am.'
];
const weeklyPrompt = PROMPTS[Math.floor(Date.now()/604800000) % PROMPTS.length];

const App = (() => {
  let user = null;
  let unsub = null;
  let page  = 'feed';
  let activeGenre = null;
  let activeTab = 'latest';

  // ── HELPERS ──
  const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  function ago(ts) {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const s = Math.floor((Date.now()-d)/1000);
    if (s<60) return 'just now';
    if (s<3600) return Math.floor(s/60)+'m ago';
    if (s<86400) return Math.floor(s/3600)+'h ago';
    return Math.floor(s/86400)+'d ago';
  }
  function toast(msg,dur=3200) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tid);
    t._tid = setTimeout(()=>t.classList.remove('show'), dur);
  }
  const main = () => document.getElementById('main');
  function stopUnsub() { if(unsub){unsub();unsub=null;} }
  const icon = (id,cls='icon') => `<svg class="${cls}" aria-hidden="true"><use href="#ic-${id}"/></svg>`;
  const readingList = () => JSON.parse(localStorage.getItem('azul_reading_list')||'[]');
  function toggleReadingList(id) {
    const list = readingList();
    const idx = list.indexOf(id);
    if (idx>-1) { list.splice(idx,1); localStorage.setItem('azul_reading_list',JSON.stringify(list)); return false; }
    else { list.push(id); localStorage.setItem('azul_reading_list',JSON.stringify(list)); return true; }
  }
  function isSaved(id) { return readingList().includes(id); }

  // ── NAV ──
  function renderNav() {
    const el = document.getElementById('nav-auth');
    if (user) {
      el.innerHTML = `
        <button class="btn-ghost" style="gap:4px;display:inline-flex;align-items:center" onclick="App.goProfile()">
          ${icon('user','icon')} <span class="nav-user">${esc(user.displayName||user.email)}</span>
        </button>
        <button class="btn-ghost" onclick="App.signOut()">Sign out</button>`;
    } else {
      el.innerHTML = `
        <button class="btn-ghost" onclick="App.openModal('login')">Sign in</button>
        <button class="btn-primary" onclick="App.openModal('register')">Join</button>`;
    }
  }

  // ── FEED ──
  function goFeed(genre) {
    page = 'feed';
    if (genre !== undefined) activeGenre = genre;
    stopUnsub();
    main().innerHTML = `<div class="loading"><span class="spin">◌</span> Loading stories…</div>`;
    let q = db.collection('stories').where('visibility','in',['public',null]);
    if (activeGenre) q = q.where('genre','==',activeGenre);
    if (activeTab === 'latest') q = q.orderBy('createdAt','desc');
    else q = q.orderBy('likeCount','desc');
    unsub = q.onSnapshot(snap => {
      let docs = snap.docs;
      if (!docs.length) {
        main().innerHTML = renderFeedShell(`<div class="empty-state">
          <div class="empty-icon">${icon('book','icon-lg')}</div>
          <p>No stories yet. Be the first to share.</p>
          <button class="btn-primary" onclick="App.goWrite()">Write a story</button>
        </div>`);
        return;
      }
      main().innerHTML = renderFeedShell(`<div class="feed">${docs.map(d=>cardHTML(d.id,d.data())).join('')}</div>`);
    }, err => {
      main().innerHTML = `<div class="empty-state"><p style="color:#e89090">Could not load stories: ${esc(err.message)}</p></div>`;
    });
  }

  function renderFeedShell(inner) {
    const tabs = ['latest','popular'].map(t =>
      `<button class="tab-btn ${activeTab===t?'active':''}" onclick="App.setTab('${t}')">${t==='latest'?'Latest':'Popular'}</button>`
    ).join('');
    const chips = GENRES.map(g =>
      `<button class="genre-chip ${activeGenre===g?'active':''}" onclick="App.goFeed('${activeGenre===g?'':g}')">${esc(g)}</button>`
    ).join('');
    return `
      <div class="prompt-banner">
        <div>
          <div class="prompt-label">Weekly Prompt</div>
          <div class="prompt-text">"${esc(weeklyPrompt)}"</div>
        </div>
        <button class="btn-primary" onclick="App.writeWithPrompt()">Write it</button>
      </div>
      <div class="feed-tabs">${tabs}</div>
      <div class="genre-bar">${chips}</div>
      ${inner}`;
  }

  function setTab(t) { activeTab = t; goFeed(); }

  function cardHTML(id, d) {
    const liked = user && (d.likes||[]).includes(user.uid);
    const saved = isSaved(id);
    const author = d.anonymous ? 'Anonymous' : esc(d.authorName||'Unknown');
    const preview = esc(d.body||'').substring(0,200) + ((d.body||'').length>200?'…':'');
    const isOwner = user && user.uid===d.authorId;
    const genreTag = d.genre ? `<span class="genre-tag">${esc(d.genre)}</span>` : '';
    const seriesTag = d.series ? `<span class="genre-tag" style="color:var(--accent);border-color:rgba(201,169,110,0.3)">${icon('book','icon-sm')} ${esc(d.series)}</span>` : '';
    return `
    <article class="card" onclick="App.openStory('${id}')">
      <div class="card-header">
        <div class="card-meta">
          <span class="author-tag ${d.anonymous?'anon':''}">${author}</span>
          <span class="time-tag">${ago(d.createdAt)}</span>
          ${genreTag}${seriesTag}
        </div>
        ${isOwner?`<button class="btn-delete" onclick="event.stopPropagation();App.deleteStory('${id}')">${icon('trash','icon-sm')}</button>`:''}
      </div>
      <h2 class="card-title">${esc(d.title)}</h2>
      <p class="card-preview">${preview}</p>
      <div class="card-footer">
        <button class="react-btn ${liked?'liked':''}" onclick="event.stopPropagation();App.toggleLike('${id}',${liked})">
          ${liked?icon('heart-fill'):icon('heart')} <span>${(d.likes||[]).length}</span>
        </button>
        <button class="react-btn" onclick="event.stopPropagation();App.openStory('${id}')">
          ${icon('comment')} <span>${(d.comments||[]).length}</span>
        </button>
        <button class="react-btn ${saved?'saved':''}" onclick="event.stopPropagation();App.toggleSave('${id}',this)" title="${saved?'Remove from reading list':'Save to reading list'}">
          ${saved?icon('bookmark-fill'):icon('bookmark')}
        </button>
        <button class="react-btn" onclick="event.stopPropagation();App.viewAuthor('${esc(d.authorId||'')}','${esc(d.authorName||'')}')" title="View author">
          ${icon('user')}
        </button>
      </div>
    </article>`;
  }

  // ── STORY VIEW ──
  async function openStory(id) {
    page = 'story';
    stopUnsub();
    main().innerHTML = `<div class="loading"><span class="spin">◌</span></div>`;
    try {
      // increment view count
      db.collection('stories').doc(id).update({ views: firebase.firestore.FieldValue.increment(1) }).catch(()=>{});

      const snap = await db.collection('stories').doc(id).get();
      if (!snap.exists) { main().innerHTML=`<p>Story not found.</p>`; return; }
      const d = snap.data();
      const liked = user && (d.likes||[]).includes(user.uid);
      const saved = isSaved(id);
      const author = d.anonymous ? 'Anonymous' : esc(d.authorName||'Unknown');
      const isOwner = user && user.uid===d.authorId;
      const comments = (d.comments||[]).length
        ? [...(d.comments||[])].reverse().map(c=>`
          <div class="comment">
            <span class="comment-author">${c.anonymous?'Anonymous':esc(c.authorName||'Unknown')}</span>
            <span class="comment-time">${ago(c.createdAt)}</span>
            <p>${esc(c.text)}</p>
          </div>`).join('')
        : `<p class="no-comments">No comments yet. Be the first.</p>`;
      const bodyHTML = renderStoryBody(d.body||'');
      const seriesBadge = d.series ? `<div class="series-badge">${icon('book','icon-sm')} ${esc(d.series)}</div>` : '';
      const genreDisp = d.genre ? `<span class="genre-tag">${esc(d.genre)}</span>` : '';

      main().innerHTML = `
        <div class="story-view">
          <button class="back-btn" onclick="App.goFeed()">${icon('arrow-left')} Back to feed</button>
          <div class="story-full">
            ${seriesBadge}
            <div class="story-top">
              <span class="author-tag ${d.anonymous?'anon':''}">${author}</span>
              <span class="time-tag">${ago(d.createdAt)}</span>
              ${genreDisp}
              ${d.views?`<span class="time-tag">${icon('eye','icon-sm')} ${d.views} views</span>`:''}
              ${isOwner?`<button class="btn-delete" onclick="App.deleteStory('${id}')">${icon('trash','icon-sm')} Delete</button>`:''}
            </div>
            <h1 class="story-title">${esc(d.title)}</h1>
            <div class="story-body">${bodyHTML}</div>
            <div class="story-actions">
              <button class="react-btn big ${liked?'liked':''}" id="like-btn" onclick="App.toggleLike('${id}',${liked},true)">
                ${liked?icon('heart-fill'):icon('heart')} ${(d.likes||[]).length} likes
              </button>
              <button class="react-btn big ${saved?'saved':''}" id="save-btn" onclick="App.toggleSaveStory('${id}')">
                ${saved?icon('bookmark-fill'):icon('bookmark')} ${saved?'Saved':'Save'}
              </button>
              ${!d.anonymous && d.authorId ? `<button class="follow-btn" id="follow-btn-${d.authorId}" onclick="App.toggleFollow('${d.authorId}','${esc(d.authorName||'')}')">${icon('users','icon-sm')} Follow Author</button>` : ''}
            </div>
          </div>
          <div class="comments-section">
            <h3 class="comments-heading">Comments <span style="font-size:.9rem;color:var(--text2);font-family:'DM Sans',sans-serif">${(d.comments||[]).length}</span></h3>
            <div id="comments-list">${comments}</div>
            <div class="comment-form">
              <textarea id="comment-text" placeholder="Share your thoughts…" rows="3"></textarea>
              <div class="comment-controls">
                <label class="anon-label">
                  <input type="checkbox" id="comment-anon"/> Post anonymously
                </label>
                <button class="btn-primary" onclick="App.postComment('${id}')">${icon('pen','icon')} Comment</button>
              </div>
            </div>
          </div>
        </div>`;

      // Check follow state
      if (user && d.authorId && !d.anonymous) {
        checkFollowState(d.authorId);
      }
    } catch(e) {
      main().innerHTML = `<p style="color:#e89090">Error: ${esc(e.message)}</p>`;
    }
  }

  function renderStoryBody(text) {
    // Render plain text with line breaks, or pass through if it contains HTML tags (from rich editor)
    if (text.includes('<') && text.includes('>')) {
      // Already HTML from rich editor — sanitize and return
      return text
        .replace(/<script[\s\S]*?<\/script>/gi,'')
        .replace(/on\w+="[^"]*"/gi,'');
    }
    return esc(text).replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br/>').replace(/^/,'<p>').replace(/$/,'</p>');
  }

  // ── FOLLOW ──
  async function checkFollowState(authorId) {
    if (!user) return;
    const btn = document.getElementById('follow-btn-'+authorId);
    if (!btn) return;
    try {
      const snap = await db.collection('users').doc(user.uid).get();
      const data = snap.data()||{};
      const following = (data.following||[]);
      if (following.includes(authorId)) {
        btn.classList.add('following');
        btn.innerHTML = icon('users','icon-sm')+' Following';
      }
    } catch(e){}
  }

  async function toggleFollow(authorId, authorName) {
    if (!user) { toast('Sign in to follow authors.'); return; }
    if (authorId === user.uid) { toast("You can't follow yourself."); return; }
    try {
      const ref = db.collection('users').doc(user.uid);
      const snap = await ref.get();
      const data = snap.data()||{};
      const following = data.following||[];
      const isFollowing = following.includes(authorId);
      await ref.set({
        following: isFollowing
          ? firebase.firestore.FieldValue.arrayRemove(authorId)
          : firebase.firestore.FieldValue.arrayUnion(authorId)
      }, {merge: true});
      const btn = document.getElementById('follow-btn-'+authorId);
      if (btn) {
        if (isFollowing) {
          btn.classList.remove('following');
          btn.innerHTML = icon('users','icon-sm')+` Follow Author`;
          toast('Unfollowed '+authorName);
        } else {
          btn.classList.add('following');
          btn.innerHTML = icon('users','icon-sm')+' Following';
          toast('Now following '+authorName);
        }
      }
    } catch(e) { toast('Error: '+e.message); }
  }

  // ── READING LIST ──
  function toggleSave(id, btn) {
    const saved = toggleReadingList(id);
    btn.className = `react-btn${saved?' saved':''}`;
    btn.innerHTML = saved ? icon('bookmark-fill') : icon('bookmark');
    toast(saved ? 'Added to reading list.' : 'Removed from reading list.');
  }

  function toggleSaveStory(id) {
    const saved = toggleReadingList(id);
    const btn = document.getElementById('save-btn');
    if (btn) {
      btn.className = `react-btn big${saved?' saved':''}`;
      btn.innerHTML = `${saved?icon('bookmark-fill'):icon('bookmark')} ${saved?'Saved':'Save'}`;
    }
    toast(saved ? 'Added to reading list.' : 'Removed from reading list.');
  }

  async function goReadingList() {
    page = 'reading-list';
    stopUnsub();
    main().innerHTML = `<div class="loading"><span class="spin">◌</span></div>`;
    const ids = readingList();
    if (!ids.length) {
      main().innerHTML = `
        <div class="reading-list-view">
          <button class="back-btn" onclick="App.goFeed()">${icon('arrow-left')} Back</button>
          <h2 class="reading-list-heading">${icon('bookmark','icon-lg')} Reading List</h2>
          <div class="empty-state">
            <p>Your reading list is empty.</p>
            <button class="btn-primary" onclick="App.goFeed()">Explore stories</button>
          </div>
        </div>`;
      return;
    }
    try {
      const promises = ids.map(id => db.collection('stories').doc(id).get());
      const snaps = await Promise.all(promises);
      const cards = snaps.filter(s=>s.exists).map(s=>cardHTML(s.id,s.data())).join('');
      main().innerHTML = `
        <div class="reading-list-view">
          <button class="back-btn" onclick="App.goFeed()">${icon('arrow-left')} Back</button>
          <h2 class="reading-list-heading">${icon('bookmark','icon-lg')} Reading List</h2>
          <div class="feed">${cards}</div>
        </div>`;
    } catch(e) {
      main().innerHTML = `<p style="color:#e89090">Error: ${esc(e.message)}</p>`;
    }
  }

  // ── WRITE ──
  function goWrite(promptText) {
    page = 'write';
    stopUnsub();
    const seriesOpts = '<option value="">No series</option>';
    main().innerHTML = `
      <div class="write-view">
        <button class="back-btn" onclick="App.goFeed()">${icon('arrow-left')} Back</button>
        <h2 class="write-heading">Tell your story</h2>
        ${promptText?`<div style="background:rgba(201,169,110,0.07);border:1px solid rgba(201,169,110,0.2);border-radius:8px;padding:14px 18px;margin-bottom:20px;font-style:italic;color:var(--accent);font-size:.9rem">"${esc(promptText)}"</div>`:''}
        <input type="text" class="story-title-input" id="w-title" placeholder="Give it a title…" maxlength="120"/>

        <div class="form-row">
          <div>
            <label class="form-label">Genre</label>
            <select id="w-genre">
              <option value="">Select genre…</option>
              ${GENRES.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="form-label">Series / Collection</label>
            <input type="text" id="w-series" placeholder="e.g. The Midnight Letters" maxlength="80"/>
          </div>
        </div>

        <div class="form-row" style="margin-bottom:14px">
          <div>
            <label class="form-label">Visibility</label>
            <select id="w-visibility">
              <option value="public">${icon('globe','icon-sm')} Public</option>
              <option value="unlisted">${icon('link','icon-sm')} Unlisted</option>
              <option value="private">${icon('lock','icon-sm')} Private</option>
            </select>
          </div>
        </div>

        <label class="form-label">Story</label>
        <div class="editor-toolbar" id="editor-toolbar">
          <button class="tool-btn" title="Bold" onmousedown="event.preventDefault();App.fmt('bold')"><strong>B</strong></button>
          <button class="tool-btn" title="Italic" onmousedown="event.preventDefault();App.fmt('italic')"><em>I</em></button>
          <button class="tool-btn" title="Underline" onmousedown="event.preventDefault();App.fmt('underline')"><u>U</u></button>
          <div class="tool-sep"></div>
          <button class="tool-btn" title="Heading 2" onmousedown="event.preventDefault();App.fmtBlock('h2')">H2</button>
          <button class="tool-btn" title="Heading 3" onmousedown="event.preventDefault();App.fmtBlock('h3')">H3</button>
          <button class="tool-btn" title="Blockquote" onmousedown="event.preventDefault();App.fmtBlock('blockquote')">"</button>
          <div class="tool-sep"></div>
          <button class="tool-btn" title="Insert image URL" onmousedown="event.preventDefault();App.insertImage()">${icon('image','icon-sm')}</button>
        </div>
        <div class="story-body-editor" id="w-body" contenteditable="true" data-placeholder="Write anything. No rules." spellcheck="true"></div>

        <div class="write-footer">
          <div class="write-options">
            <label class="anon-label">
              <input type="checkbox" id="w-anon" ${!user?'checked disabled':''}/>
              Post anonymously${!user?' (not signed in)':''}
            </label>
          </div>
          <button class="btn-primary large" id="publish-btn" onclick="App.submitStory()">
            ${icon('pen','icon')} Publish
          </button>
        </div>
      </div>`;
  }

  function writeWithPrompt() { goWrite(weeklyPrompt); }

  // ── RICH EDITOR ──
  function fmt(cmd) { document.execCommand(cmd, false, null); }
  function fmtBlock(tag) { document.execCommand('formatBlock', false, tag); }
  function insertImage() {
    const url = prompt('Image URL:');
    if (url) document.execCommand('insertHTML', false, `<img src="${url.replace(/"/g,'')}" alt="story image"/>`);
  }

  async function submitStory() {
    const title = (document.getElementById('w-title').value||'').trim();
    const bodyEl = document.getElementById('w-body');
    const body = bodyEl ? bodyEl.innerHTML.trim() : '';
    const bodyText = bodyEl ? bodyEl.innerText.trim() : '';
    const anon = document.getElementById('w-anon').checked || !user;
    const genre = document.getElementById('w-genre').value;
    const series = (document.getElementById('w-series').value||'').trim();
    const visibility = document.getElementById('w-visibility').value;
    if (!title) { toast('Please add a title.'); return; }
    if (!bodyText) { toast('Please write your story.'); return; }
    const btn = document.getElementById('publish-btn');
    btn.disabled = true; btn.innerHTML = icon('pen','icon')+' Publishing…';
    try {
      await db.collection('stories').add({
        title, body,
        genre: genre||null,
        series: series||null,
        visibility: visibility||'public',
        anonymous: anon,
        authorId: user ? user.uid : null,
        authorName: user ? (user.displayName||user.email) : null,
        likes: [],
        likeCount: 0,
        comments: [],
        views: 0,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      toast('Story published!');
      goFeed();
    } catch(e) {
      toast('Error publishing: '+e.message);
      btn.disabled=false; btn.innerHTML=icon('pen','icon')+' Publish';
    }
  }

  // ── LIKE ──
  async function toggleLike(id, liked, reload) {
    if (!user) { toast('Sign in to like stories.'); return; }
    try {
      await db.collection('stories').doc(id).update({
        likes: liked
          ? firebase.firestore.FieldValue.arrayRemove(user.uid)
          : firebase.firestore.FieldValue.arrayUnion(user.uid),
        likeCount: firebase.firestore.FieldValue.increment(liked?-1:1)
      });
      if (reload) openStory(id);
      else goFeed();
    } catch(e) { toast('Error: '+e.message); }
  }

  // ── COMMENT ──
  async function postComment(storyId) {
    const textEl = document.getElementById('comment-text');
    const text = textEl ? textEl.value.trim() : '';
    const anon = document.getElementById('comment-anon').checked || !user;
    if (!text) { toast('Write something first.'); return; }
    const btn = document.querySelector('.comment-form .btn-primary');
    if(btn){btn.disabled=true;}
    try {
      await db.collection('stories').doc(storyId).update({
        comments: firebase.firestore.FieldValue.arrayUnion({
          text,
          anonymous: anon,
          authorName: user?(user.displayName||user.email):null,
          authorId: user?user.uid:null,
          createdAt: new Date().toISOString()
        })
      });
      if(textEl) textEl.value='';
      openStory(storyId);
    } catch(e) {
      toast('Error: '+e.message);
      if(btn){btn.disabled=false;}
    }
  }

  // ── DELETE ──
  async function deleteStory(id) {
    if (!confirm('Delete this story forever?')) return;
    try {
      await db.collection('stories').doc(id).delete();
      toast('Story deleted.');
      goFeed();
    } catch(e) { toast('Error: '+e.message); }
  }

  // ── SEARCH ──
  function doSearch(query) {
    query = (query||'').trim();
    if (!query) { goFeed(); return; }
    page = 'search';
    stopUnsub();
    main().innerHTML = `<div class="loading"><span class="spin">◌</span></div>`;
    const q = db.collection('stories').where('visibility','in',['public',null]).orderBy('createdAt','desc').limit(200);
    q.get().then(snap => {
      const ql = query.toLowerCase();
      const results = snap.docs.filter(d => {
        const data = d.data();
        return (data.title||'').toLowerCase().includes(ql)
          || (data.authorName||'').toLowerCase().includes(ql)
          || (data.genre||'').toLowerCase().includes(ql)
          || (data.series||'').toLowerCase().includes(ql);
      });
      main().innerHTML = `
        <div class="search-view">
          <button class="back-btn" onclick="App.goFeed()">${icon('arrow-left')} Back</button>
          <h2 class="search-heading">${results.length} result${results.length!==1?'s':''} for "<span>${esc(query)}</span>"</h2>
          ${results.length
            ? `<div class="feed">${results.map(d=>cardHTML(d.id,d.data())).join('')}</div>`
            : `<div class="empty-state"><p>No stories match that search.</p></div>`}
        </div>`;
    }).catch(e => {
      main().innerHTML = `<p style="color:#e89090">Search error: ${esc(e.message)}</p>`;
    });
  }

  // ── AUTHOR PAGE ──
  async function viewAuthor(authorId, authorName) {
    if (!authorId || authorId==='null') return;
    page = 'author';
    stopUnsub();
    main().innerHTML = `<div class="loading"><span class="spin">◌</span></div>`;
    try {
      const snap = await db.collection('stories').where('authorId','==',authorId).where('anonymous','==',false).orderBy('createdAt','desc').get();
      const stories = snap.docs;
      const totalLikes = stories.reduce((sum,d)=>sum+((d.data().likes||[]).length),0);
      const totalViews = stories.reduce((sum,d)=>sum+(d.data().views||0),0);
      let isFollowing = false;
      if (user) {
        const usnap = await db.collection('users').doc(user.uid).get();
        isFollowing = ((usnap.data()||{}).following||[]).includes(authorId);
      }
      main().innerHTML = `
        <div class="profile-view">
          <button class="back-btn" onclick="App.goFeed()">${icon('arrow-left')} Back</button>
          <div class="profile-header">
            <div class="profile-avatar">${esc((authorName||'?')[0].toUpperCase())}</div>
            <div class="profile-name">${esc(authorName||'Author')}</div>
            ${user && user.uid!==authorId
              ? `<button class="follow-btn ${isFollowing?'following':''}" id="follow-btn-${authorId}" onclick="App.toggleFollow('${authorId}','${esc(authorName||'')}')" style="margin-top:12px">
                  ${icon('users','icon-sm')} ${isFollowing?'Following':'Follow'}
                </button>`
              : ''}
            <div class="profile-stats">
              <div class="profile-stat"><div class="profile-stat-num">${stories.length}</div><div class="profile-stat-label">Stories</div></div>
              <div class="profile-stat"><div class="profile-stat-num">${totalLikes}</div><div class="profile-stat-label">Likes</div></div>
              <div class="profile-stat"><div class="profile-stat-num">${totalViews}</div><div class="profile-stat-label">Views</div></div>
            </div>
          </div>
          ${stories.length
            ? `<div class="feed">${stories.map(d=>cardHTML(d.id,d.data())).join('')}</div>`
            : `<div class="empty-state"><p>No public stories yet.</p></div>`}
        </div>`;
    } catch(e) {
      main().innerHTML = `<p style="color:#e89090">Error: ${esc(e.message)}</p>`;
    }
  }

  // ── MY PROFILE ──
  async function goProfile() {
    if (!user) { openModal('login'); return; }
    page = 'profile';
    stopUnsub();
    main().innerHTML = `<div class="loading"><span class="spin">◌</span></div>`;
    try {
      const snap = await db.collection('stories').where('authorId','==',user.uid).orderBy('createdAt','desc').get();
      const stories = snap.docs;
      const totalLikes = stories.reduce((sum,d)=>sum+((d.data().likes||[]).length),0);
      const totalViews = stories.reduce((sum,d)=>sum+(d.data().views||0),0);
      const totalComments = stories.reduce((sum,d)=>sum+((d.data().comments||[]).length),0);
      main().innerHTML = `
        <div class="profile-view">
          <button class="back-btn" onclick="App.goFeed()">${icon('arrow-left')} Back</button>
          <div class="profile-header">
            <div class="profile-avatar">${esc((user.displayName||user.email||'?')[0].toUpperCase())}</div>
            <div class="profile-name">${esc(user.displayName||user.email)}</div>
            <div style="color:var(--text2);font-size:.83rem;margin-top:4px">${esc(user.email)}</div>
            <div class="profile-stats">
              <div class="profile-stat"><div class="profile-stat-num">${stories.length}</div><div class="profile-stat-label">Stories</div></div>
              <div class="profile-stat"><div class="profile-stat-num">${totalLikes}</div><div class="profile-stat-label">Likes</div></div>
              <div class="profile-stat"><div class="profile-stat-num">${totalViews}</div><div class="profile-stat-label">Views</div></div>
            </div>
          </div>
          <div class="analytics-section">
            <h3 class="analytics-heading">${icon('bar-chart','icon-sm')} Analytics</h3>
            <div class="analytics-grid">
              <div class="analytics-card"><div class="analytics-num">${stories.length}</div><div class="analytics-label">Total Stories</div></div>
              <div class="analytics-card"><div class="analytics-num">${totalLikes}</div><div class="analytics-label">Total Likes</div></div>
              <div class="analytics-card"><div class="analytics-num">${totalViews}</div><div class="analytics-label">Total Views</div></div>
              <div class="analytics-card"><div class="analytics-num">${totalComments}</div><div class="analytics-label">Comments Received</div></div>
              <div class="analytics-card"><div class="analytics-num">${readingList().length}</div><div class="analytics-label">Reading List</div></div>
              <div class="analytics-card" style="cursor:pointer" onclick="App.goReadingList()">
                <div class="analytics-num" style="font-size:1.2rem">${icon('bookmark','icon-lg')}</div>
                <div class="analytics-label">View Reading List</div>
              </div>
            </div>
          </div>
          <h3 style="font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:20px;color:var(--text2)">Your Stories</h3>
          ${stories.length
            ? `<div class="feed">${stories.map(d=>cardHTML(d.id,d.data())).join('')}</div>`
            : `<div class="empty-state"><p>You haven't published any stories yet.</p><button class="btn-primary" onclick="App.goWrite()">Write your first story</button></div>`}
        </div>`;
    } catch(e) {
      main().innerHTML = `<p style="color:#e89090">Error: ${esc(e.message)}</p>`;
    }
  }

  // ── MODAL ──
  function openModal(type) {
    const overlay = document.getElementById('modal-overlay');
    const box = document.getElementById('modal-box');
    overlay.classList.add('visible');
    if (type==='register') {
      box.innerHTML = `
        <button class="modal-close" onclick="App.closeModal()">${icon('x')}</button>
        <h2 class="modal-title">Create account</h2>
        <div class="error-msg" id="modal-err"></div>
        <input type="text"     id="r-name"  placeholder="Your name" autocomplete="name"/>
        <input type="email"    id="r-email" placeholder="Email address" autocomplete="email"/>
        <input type="password" id="r-pass"  placeholder="Password (6+ characters)" autocomplete="new-password"/>
        <button class="btn-primary full" id="modal-btn" onclick="App.doRegister()">Create account</button>
        <p class="modal-switch">Already have an account? <a onclick="App.openModal('login')">Sign in</a></p>`;
    } else {
      box.innerHTML = `
        <button class="modal-close" onclick="App.closeModal()">${icon('x')}</button>
        <h2 class="modal-title">Welcome back</h2>
        <div class="error-msg" id="modal-err"></div>
        <input type="email"    id="l-email" placeholder="Email address" autocomplete="email"/>
        <input type="password" id="l-pass"  placeholder="Password" autocomplete="current-password"/>
        <button class="btn-primary full" id="modal-btn" onclick="App.doLogin()">Sign in</button>
        <p class="modal-switch">No account? <a onclick="App.openModal('register')">Create one</a></p>`;
    }
  }

  function showModalError(msg) {
    const el = document.getElementById('modal-err');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
  }
  function closeModal() { document.getElementById('modal-overlay').classList.remove('visible'); }
  function modalClickOutside(e) { if (e.target===document.getElementById('modal-overlay')) closeModal(); }

  // ── AUTH ──
  async function doRegister() {
    const name  = document.getElementById('r-name').value.trim();
    const email = document.getElementById('r-email').value.trim();
    const pass  = document.getElementById('r-pass').value;
    if (!name)  { showModalError('Please enter your name.'); return; }
    if (!email) { showModalError('Please enter your email.'); return; }
    if (pass.length<6) { showModalError('Password must be at least 6 characters.'); return; }
    const btn = document.getElementById('modal-btn');
    btn.disabled=true; btn.textContent='Creating account…';
    try {
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      await cred.user.updateProfile({ displayName: name });
      user = auth.currentUser;
      closeModal();
      renderNav();
      toast(`Welcome to Azul, ${name}!`);
      if (page==='feed') goFeed();
    } catch(e) {
      btn.disabled=false; btn.textContent='Create account';
      const msgs = {
        'auth/email-already-in-use': 'That email is already registered.',
        'auth/invalid-email': 'Invalid email address.',
        'auth/weak-password': 'Password is too weak.',
        'auth/operation-not-allowed': 'Email/password sign-in not enabled in Firebase Console.',
        'auth/network-request-failed': 'Network error.',
      };
      showModalError(msgs[e.code]||e.message);
    }
  }

  async function doLogin() {
    const email = document.getElementById('l-email').value.trim();
    const pass  = document.getElementById('l-pass').value;
    if (!email) { showModalError('Please enter your email.'); return; }
    if (!pass)  { showModalError('Please enter your password.'); return; }
    const btn = document.getElementById('modal-btn');
    btn.disabled=true; btn.textContent='Signing in…';
    try {
      await auth.signInWithEmailAndPassword(email, pass);
      closeModal();
      toast('Signed in!');
    } catch(e) {
      btn.disabled=false; btn.textContent='Sign in';
      const msgs = {
        'auth/user-not-found': 'No account found with that email.',
        'auth/wrong-password': 'Incorrect password.',
        'auth/invalid-email': 'Invalid email address.',
        'auth/invalid-credential': 'Wrong email or password.',
        'auth/too-many-requests': 'Too many attempts. Try again later.',
      };
      showModalError(msgs[e.code]||e.message);
    }
  }

  async function signOut() {
    await auth.signOut();
    toast('Signed out.');
    goFeed();
  }

  // ── AUTH LISTENER ──
  auth.onAuthStateChanged(u => { user=u; renderNav(); });

  // ── INIT ──
  window.addEventListener('DOMContentLoaded', () => {
    renderNav();
    goFeed();
    // Hook up nav search on input enter
    const si = document.getElementById('nav-search-input');
    if(si) si.addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(si.value); });
  });

  return {
    goFeed, goWrite, writeWithPrompt, openStory, submitStory,
    toggleLike, postComment, deleteStory,
    toggleSave, toggleSaveStory, goReadingList,
    openModal, closeModal, modalClickOutside,
    doRegister, doLogin, signOut,
    doSearch, viewAuthor, goProfile, toggleFollow, checkFollowState,
    setTab, fmt, fmtBlock, insertImage
  };
})();
</script>
</body>
</html>
